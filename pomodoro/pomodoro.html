<!DOCTYPE html>
<!-- Define que o documento é HTML5 -->
<html lang="pt-br">
<!-- Início do HTML e define o idioma como português do Brasil -->

<head>
    <meta charset="UTF-8">
    <!-- Permite usar acentuação e caracteres especiais -->

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Faz o site se adaptar a telas menores (responsivo) -->

    <title>Pomodoro Simples</title>
    <!-- Título da aba do navegador -->

    <style>
        /* Reset básico: remove margens e paddings padrão */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            height: 100vh; /* ocupa a altura inteira da tela */
            display: flex; /* ativa o flexbox */
            justify-content: center; /* centraliza horizontalmente */
            align-items: center; /* centraliza verticalmente */
            background: #1e1e2f; /* cor de fundo */
            font-family: Arial, sans-serif; /* fonte */
            color: #fff; /* cor do texto */
        }

        .container {
            text-align: center; /* centraliza texto */
            background: #2c2c3f; /* fundo do card */
            padding: 30px; /* espaçamento interno */
            border-radius: 10px; /* bordas arredondadas */
            box-shadow: 0 0 15px rgba(0,0,0,0.5); /* sombra */
        }

        h1 {
            margin-bottom: 20px; /* espaço abaixo do título */
        }

        #timer {
            font-size: 48px; /* tamanho grande do tempo */
            margin: 20px 0; /* espaço acima e abaixo */
        }

        button {
            padding: 10px 20px; /* tamanho interno */
            margin: 5px; /* espaço entre botões */
            border: none; /* remove borda */
            border-radius: 5px; /* borda arredondada */
            cursor: pointer; /* muda o cursor */
            font-size: 16px; /* tamanho do texto */
        }

        .start { background: #4caf50; } /* verde */
        .pause { background: #ff9800; } /* laranja */
        .reset { background: #f44336; } /* vermelho */
    </style>
</head>

<body>
    <div class="container">
        <h1>Pomodoro</h1>

        <div id="timer">25:00</div>
        <!-- Tempo inicial: 25 minutos -->

        <button class="start" onclick="startTimer()">Iniciar</button>
        <!-- chama função startTimer ao clicar -->

        <button class="pause" onclick="pauseTimer()">Pausar</button>
        <!-- chama função pauseTimer -->

        <button class="reset" onclick="resetTimer()">Resetar</button>
        <!-- chama função resetTimer -->
    </div>

    <script>
        let time = 25 * 60; 
        // tempo em segundos (25 minutos * 60)

        let interval = null; 
        // variável que vai guardar o setInterval

        function updateDisplay() {
            let minutes = Math.floor(time / 60);
            // pega os minutos inteiros

            let seconds = time % 60;
            // pega o resto (segundos)

            seconds = seconds < 10 ? '0' + seconds : seconds;
            // adiciona 0 se for menor que 10 (ex: 09)

            document.getElementById('timer').textContent = `${minutes}:${seconds}`;
            // atualiza o texto na tela
        }

        function startTimer() {
            if (interval) return;
            // evita criar vários timers ao mesmo tempo

            interval = setInterval(() => {
                if (time > 0) {
                    time--;
                    updateDisplay();
                } else {
                    clearInterval(interval);
                    interval = null;
                    alert('Tempo finalizado!');
                }
            }, 1000);
            // executa a cada 1 segundo (1000 ms)
        }

        function pauseTimer() {
            clearInterval(interval);
            // para o contador

            interval = null;
        }

        function resetTimer() {
            clearInterval(interval);
            interval = null;

            time = 25 * 60;
            // volta para 25 minutos

            updateDisplay();
        }

        updateDisplay();
        // inicializa o display quando a página carrega
    </script>
</body>

</html>
